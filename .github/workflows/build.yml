name: Build

# Every push builds a Windows exe and keeps it as a workflow artifact (for testing before a release).
# Pushing a tag like v0.1.0 additionally publishes a GitHub Release with the zip attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/lite-browser.exe dist/LiteBrowser.exe
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath LiteBrowser-windows-x64.zip -Force
          "exe size: {0:N1} MB" -f ((Get-Item dist/LiteBrowser.exe).Length / 1MB)

      - uses: actions/upload-artifact@v7
        with:
          name: LiteBrowser-windows-x64
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          # The zip is for people; the bare exe is what the in-app updater downloads.
          files: |
            LiteBrowser-windows-x64.zip
            dist/LiteBrowser.exe
          generate_release_notes: true
