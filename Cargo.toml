[package]
name = "lite-browser"
version = "0.2.2"
edition = "2021"
description = "Low-memory tabbed browser shell for Windows (Slint UI + WebView2)"
license = "GPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Browser-data import (bookmarks/history via SQLite; passwords encoded into our own store).
# Cross-platform so the readers can be unit tested on any host.
rusqlite = { version = "0.40", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
getrandom = "0.2"
# A Chrome Web Store .crx is a small header followed by a plain zip.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
] }
raw-window-handle = "0.6"
webview2-com = "0.39"
windows-core = "0.62"
png = "0.17"
# Slint already builds this version with these features; it draws the native menus' icons.
resvg = { version = "0.48", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
